version: "3.8"
services:
  db:
    image: postgres:16
    container_name: ttt_postgres
    restart: always
    environment:
      POSTGRES_USER: ttt
      POSTGRES_PASSWORD: tttpass
      POSTGRES_DB: ttt_db
    ports:
      - "5432:5432"
    volumes:
      - ttt_pg_data:/var/lib/postgresql/data

volumes:
  ttt_pg_data:
